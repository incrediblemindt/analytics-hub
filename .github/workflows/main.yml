name: TikTok Daily Pull

on:
  schedule:
    - cron: "10 12 * * *"  # daily 12:10 UTC (7:10am Chicago standard)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - run: pip install -r requirements.txt
    
    - name: Auth to GCP (service account JSON)
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
    
    - name: Run daily TikTok pull
      env:
        TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
        TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      run: python scripts/daily_tiktok_pull.py
